<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Armada</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <main class="shell" id="landing">
      <section class="card">
        <div class="brand">
          <div class="mark" aria-hidden="true">
            <span></span><span></span><span></span>
          </div>
          <h1>Armada</h1>
          <p class="lede">局域网 Cursor 舰队指挥台</p>
        </div>

        <p id="windows-hint" class="hint" hidden>Windows 请加入已有舰队，创建中台仅支持 macOS。</p>

        <fieldset id="mode-field" class="segment">
          <legend class="sr-only">选择入口</legend>
          <div class="segment-track">
            <label id="mode-create-label" class="segment-item">
              <input type="radio" name="mode" value="create" id="mode-create" checked />
              <span>创建舰队</span>
            </label>
            <label id="mode-join-label" class="segment-item">
              <input type="radio" name="mode" value="join" id="mode-join" />
              <span>加入舰队</span>
            </label>
          </div>
        </fieldset>

        <div id="create-pane" class="pane" hidden>
          <p class="pane-copy">在本机启动或接入中台，随后进入看板派发任务。</p>
          <button type="button" class="btn btn-primary" id="create">创建舰队</button>
        </div>

        <div id="join-pane" class="pane" hidden>
          <label class="field-label" for="join-uri">邀请链接</label>
          <form id="join-form" class="join-form">
            <input
              id="join-uri"
              class="field"
              placeholder="armada://join?hub=host:port&amp;token=…"
              autocomplete="off"
              spellcheck="false"
            />
            <button type="submit" class="btn btn-primary" id="join">加入舰队</button>
          </form>
        </div>

        <p id="err" class="err" hidden></p>
      </section>
    </main>
    <iframe id="board" title="Armada 看板" hidden></iframe>
    <p id="toast" class="toast" hidden></p>
  </body>
</html>
